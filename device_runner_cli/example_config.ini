# Device Runner CLI Configuration File
# This file configures the script mode operation
# All paths can be absolute or relative to the script location

[application]
# Architecture of the application
arch=zynqMP

# Reference clock frequency of the application
ref_clk=33

# Application ELF file for execution
# This file is used to execute the application
fbsl_elf_file=bin\fsbl.elf
app_elf_file=bin\jtag_app.elf

# FPGA bit file for programming
# This file is used to program the FPGA before running the application
bit_file=bin\kv260_design.bit

# Boot mode
# JTAG: JTAG mode (jtag)
# JTAG_SCRIPT: JTAG script mode - reading and writing to registers via JTAG (jtag_script)
# UART: UART mode - reading commands from UART and responding (uart)
boot_mode=jtag_script

[connection]
# Hardware server connection settings
# Hostname or IP address of the hardware server
hw_server=localhost
# Port is typically 3121 (default)

term_app=device_runner_term.bat

[logging]
# Logging configuration
log_dir=logs

# Log file path for script execution output
log_file=script_execution.log

[microblaze]
# Microblaze configuration
# Enable Microblaze setup and application download
# Set to 1, true, or yes to enable; 0, false, or no to disable
enable=0
# Microblaze ELF file path (required if enable=1)
mb_elf_file=bin\microblaze_app.elf

