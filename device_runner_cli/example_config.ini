# Device Runner CLI Configuration File
# This file configures the script mode operation
# All paths can be absolute or relative to the script location

[fpga]
# FPGA bit file for programming
# This file is used to program the FPGA before running the application
bit_file=design.bit

[connection]
# Hardware server connection settings
# Hostname or IP address of the hardware server
hw_server=localhost
# Port is typically 3121 (default)

[registers]
# Memory register addresses for command/response communication
# These addresses must match the addresses defined in your linker script
command_addr=0x10000000
response_addr=0x10000004
startup_mode_addr=0x10000008

[timing]
# Timing configuration for command execution
# Timeout in milliseconds for waiting for device responses
timeout=5000
# Number of retry attempts for failed commands
retries=3

[logging]
# Logging configuration
# Log file path for script execution output
log_file=script_execution.log

[microblaze]
# Microblaze configuration
# Enable Microblaze setup and application download
# Set to 1, true, or yes to enable; 0, false, or no to disable
enable=0
# Microblaze ELF file path (required if enable=1)
# mb_elf=microblaze_app.elf

[commands]
# Command sequence to execute
# Commands are executed in order (cmd1, cmd2, cmd3, etc.)
# Available commands:
#   init              - Initialize the application
#   run_app           - Run the application
#   set_param <name> <value> - Set a parameter value
#   get_status        - Get current status
#   capture_ram       - Capture RAM data
#   set_config <name> <value> <type> - Set configuration (type: 1=string, 2=hex, 3=list)
#   get_config <name> - Get configuration value
#   delay <ms>        - Delay execution for specified milliseconds
#   exit              - Exit the application
cmd1=init
cmd2=set_param param1 0x00000002
cmd3=run_app
cmd4=get_status
cmd5=capture_ram
cmd6=delay 2000
cmd7=get_status
cmd8=exit

[parameters]
# Default parameter values (optional)
# These can be used as default values before commands execute
param1=0x00000001
param2=0x43C00000
param3=0x00001000
