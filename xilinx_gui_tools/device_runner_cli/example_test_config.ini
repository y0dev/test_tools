# Device Runner CLI Test Configuration File
# This file configures test mode operation
# All paths can be absolute or relative to the script location

[test]
# Test configuration settings
# Number of test cases to run
number_of_tests=3
# Timeout in milliseconds for each test
timeout=10000
# Number of retry attempts for failed tests
retries=2

[fpga]
# FPGA bit file for programming (same as example_config.ini)
# This file is used to program the FPGA before running tests
bit_file=design.bit

[connection]
# Hardware server connection settings (same as example_config.ini)
# Hostname or IP address of the hardware server
hw_server=localhost
# Port is typically 3121 (default)

[registers]
# Memory register addresses for command/response communication (same as example_config.ini)
# These addresses must match the addresses defined in your linker script
command_addr=0xXXXX0000
response_addr=0xXXXX0004
startup_mode_addr=0xXXXX0008

[timing]
# Timing configuration for test execution (same as example_config.ini)
# Timeout in milliseconds for waiting for device responses
timeout=5000
# Number of retry attempts for failed commands
retries=3

[logging]
# Logging configuration (same as example_config.ini)
# Log file path for test execution output
log_file=test_execution.log

[microblaze]
# Microblaze configuration (same as example_config.ini)
# Enable Microblaze setup and application download
# Set to 1, true, or yes to enable; 0, false, or no to disable
enable=0
# Microblaze ELF file path (required if enable=1)
# mb_elf=microblaze_app.elf

[test_cases]
# Test case definitions
# Each test case can have a name, description, and commands

# Test Case 1
case_1.name=Basic Functionality Test
case_1.description=Test basic application functionality
case_1.commands=init,run_app,get_status

# Test Case 2
case_2.name=Configuration Test
case_2.description=Test configuration settings
case_2.commands=init,set_config device_name TestDevice 1,set_config base_address 0x43C00000 2,get_config device_name,get_config base_address

# Test Case 3
case_3.name=Status Check Test
case_3.description=Test status retrieval
case_3.commands=init,get_status,run_app,get_status

[test_parameters]
# Test parameter values (optional)
# These can be used as default values before tests execute
param1=0x00000001
param2=0x43C00000
param3=0x00001000

[test_commands]
# Test command sequence (optional - can override test case commands)
# Commands are executed in order (cmd1, cmd2, cmd3, etc.)
# Available commands:
#   init              - Initialize the application
#   run_app           - Run the application
#   set_param <name> <value> - Set a parameter value
#   get_status        - Get current status
#   capture_ram       - Capture RAM data
#   set_config <name> <value> <type> - Set configuration (type: 1=string, 2=hex, 3=list)
#   get_config <name> - Get configuration value
#   delay <ms>        - Delay execution for specified milliseconds
#   exit              - Exit the application
# cmd1=init
# cmd2=set_param param1 0x00000002
# cmd3=run_app
# cmd4=get_status
# cmd5=capture_ram
# cmd6=delay 2000
# cmd7=get_status
# cmd8=exit

