# Device Runner CLI Configuration File
# This file configures the script mode operation

[fpga]
# FPGA bit file for programming
bit_file=design.bit

[connection]
# Hardware server connection settings
hw_server=localhost

[registers]
# Memory register addresses for command/response communication
command_addr=0xXXXX0000
response_addr=0xXXXX0004
startup_mode_addr=0xXXXX0008

[timing]
# Timing configuration for command execution
timeout=5000
retries=3

[logging]
# Logging configuration
log_file=script_execution.log

[commands]
# Command sequence to execute
# Commands are executed in order (cmd1, cmd2, cmd3, etc.)
cmd1=init
cmd2=set_param param1 0x00000002
cmd3=run_app
cmd4=get_status
cmd5=capture_ram
cmd6=delay 2000
cmd7=get_status
cmd8=exit

[parameters]
# Default parameter values
param1=0x00000001
param2=0x43C00000
param3=0x00001000
